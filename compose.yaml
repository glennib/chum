# Local ClickHouse for the end-to-end test (tests/integration.rs).
# Start: mise run db:up    (picks podman, falls back to docker)
# Stop:  mise run db:down
#
# Or run a compose runtime directly: `podman compose up -d` / `docker compose up -d`.
#
# The e2e test is `#[ignore]`d by default, so this is only needed when running
# `cargo nextest run --run-ignored all`.
#
# The HTTP interface is published on host port 8124 (not the ClickHouse default
# 8123) so it never collides with another project's ClickHouse already bound to
# 8123. Point the tests at it with `CLICKHOUSE_URL=http://localhost:8124`.

services:
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-data:
